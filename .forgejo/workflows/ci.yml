name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  check:
    # Check actor on the runner; Forgejo 16.0.5 can omit it when resolving needs.
    if: forgejo.repository_owner == 'vjeranc'
    name: Python ${{ matrix.python-version }}
    runs-on: host
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Require the workflow owner
        if: forgejo.actor != 'vjeranc'
        run: exit 1

      - name: Checkout from Forgejo
        uses: actions/checkout@v4
        with:
          github-server-url: ${{ forgejo.server_url }}
          persist-credentials: false

      - name: Create Python environment
        run: uv venv --python "$UV_PYTHON" .venv

      - name: Run tests
        run: make test PYTHON=.venv/bin/python

      - name: Install typecheck dependencies
        run: uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Run typecheck
        run: make typecheck PYTHON=.venv/bin/python
